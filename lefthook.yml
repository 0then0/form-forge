pre-commit:
  commands:
    biome:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,json,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

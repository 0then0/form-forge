pre-commit:
  commands:
    prettier:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,json,css,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
